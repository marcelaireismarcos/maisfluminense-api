plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    bundle {
        storeArchive {
            enable = false }
    }
    compileSdk 36
    defaultConfig {
        applicationId "maisfluminense.vikkynsnorth.noticias"
        minSdkVersion 23
        targetSdk 36
        versionCode 49
        versionName "5.8"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/LICENSE',
                    'META-INF/LICENSE-FIREBASE.txt',
                    'META-INF/NOTICE'
            ]
        }
    }

    namespace 'maisfluminense.vikkynsnorth.noticias'

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // ─── AndroidX Core ───────────────────────────────────────────────
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'

    // ─── Material Design 3 ───────────────────────────────────────────
    // Necessário para Theme.MaterialComponents e novos componentes de UI
    implementation 'com.google.android.material:material:1.14.0'

    // ─── Lifecycle ───────────────────────────────────────────────────
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    //noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.11.0'

    // ─── Networking ──────────────────────────────────────────────────
    // Jsoup — parsing HTML/RSS (já estava no projeto)
    implementation 'org.jsoup:jsoup:1.22.2'

    // Retrofit — chamadas HTTP para APIs (tabela de classificação, fase 3+)
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // OkHttp logging (apenas debug)
    debugImplementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    // OkHttp core (necessário para Retrofit em todos os builds)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // ─── Imagens ─────────────────────────────────────────────────────
    // Glide — carregamento de imagens moderno (substitui urlimageviewhelper)
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.7'

    // CircleImageView — mantido (usado na tela principal)
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // ─── Ads ─────────────────────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    //Updated
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    implementation 'com.android.volley:volley:1.2.1'

    // ─── Firebase / Notificações ─────────────────────────────────────
    implementation 'com.google.firebase:firebase-messaging:25.1.1'

    // ─── OneSignal ───────────────────────────────────────────────────
    implementation 'com.onesignal:OneSignal:5.9.7'

    // ─── ExoPlayer (para TV e vídeos futuros) ───────────────────────
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.19.1'

    // ─── Google Play Services ────────────────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.gms:play-services-analytics:18.1.1'

    // ─── Testes ──────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
